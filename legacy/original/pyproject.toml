[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencealpha"
version = "0.1.0"
description = "Investment-research agent answering from traceable public evidence."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7,<3",
    "lxml>=5.2,<7",
    "pymupdf>=1.24,<2",
    # Doc 04 §7: the two post-parser dependencies. CPU torch wheels
    # suffice; install torch from the cpu index before this project.
    "sentence-transformers>=3.0",
    "chromadb>=1.0,<2",
]

[dependency-groups]
# Spike outcome (2026-08-15, doc 03 §18): EdgarTools parses SEC HTML
# offline but its document model carries no source-DOM anchors, so it
# cannot meet the SEC route's per-block tier-1 locator minimum; the
# in-house lxml adapter is primary. EdgarTools stays here as a
# dev-time comparator and the planned acquisition/search client — it
# is not a runtime dependency of the parser.
spike = [
    "edgartools>=4.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "pylint>=3.2",
    "pytest>=8.2",
]

[tool.setuptools]
packages = [
    "contracts",
    "ingestion",
    "ingestion.parsing",
    "ingestion.parsing.adapters",
    "ingestion.parsing.converters",
]

[tool.black]
line-length = 80
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
