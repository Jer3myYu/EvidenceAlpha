[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencealpha"
version = "0.3.0"
description = "Source-grounded research with bounded independent review and stage replay"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pymupdf==1.28.2",
  "beautifulsoup4==4.15.0",
  "markdown-it-py>=3,<5",
  "matplotlib>=3.9,<4",
  "requests>=2.32,<3",
  "tavily-python>=0.8,<1",
  "claude-agent-sdk==0.2.151",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3,<6"]
dev = ["black==26.5.1", "pylint>=3.2,<5", "pytest==9.1.1"]

[project.scripts]
evidencealpha = "evidencealpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evidencealpha*"]

[tool.setuptools.package-data]
evidencealpha = ["prompts/*.md"]

[tool.black]
line-length = 80
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests/redesign"]
pythonpath = ["src"]
addopts = "-q"
