[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencealpha"
version = "0.2.0"
description = "Progressive industry-research agent. Phase 1: standalone RAG."
requires-python = ">=3.11,<3.13"
dependencies = [
    # LangChain pieces used by src/rag: loaders, splitter, Chroma, embeddings.
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.2",
    "langchain-huggingface>=0.1",
    # PyMuPDFLoader needs the pymupdf package itself.
    "pymupdf>=1.24",
    # Phase 1 decision (2026-09-02): all-MiniLM-L6-v2, local, via
    # sentence-transformers. Install torch from the CPU wheel index
    # BEFORE this project so pip does not pull the CUDA build:
    #   .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
    "sentence-transformers>=3.0",
    # Phase 2 decision (2026-09-02): the official Claude Agent SDK, pinned
    # to the version verified against the local Claude Code login. The
    # wheel bundles the Claude Code CLI binary (~215 MB).
    "claude-agent-sdk==0.2.151",
    # Phase 4 decision (2026-09-02): Tavily web search, key in TAVILY_API_KEY.
    "tavily-python>=0.8",
    # Phase 5 decision (2026-09-02): WebBaseLoader needs BeautifulSoup.
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "black>=24.4",
    "pylint>=3.2",
    "pytest>=8.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rag", "research"]

[tool.black]
line-length = 80
target-version = ["py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
